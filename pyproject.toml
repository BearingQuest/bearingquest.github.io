[project]
name = "bearing-quest-site-tests"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
# Dependency cooldown: resolve only releases at least 7 days old (docs/decisions.md).
# Keep this the first key in the table: Semgrep's uv cooldown rule stops reading at the first opening square bracket.
exclude-newer = "7 days"
# The blog build (scripts/build-blog.sh) needs "site", so uv sync and uv run install it
# up front; the Pages build adds --no-dev to leave the test tools out.
default-groups = ["dev", "site"]
# Pelican 4.12.0 caps pygments below 2.20, which would lock 2.19.2 (PYSEC-2026-2987).
# Remove this override when a Pelican release lifts the cap (docs/decisions.md).
override-dependencies = ["pygments>=2.20.0"]

[dependency-groups]
dev = [
  "defusedxml==0.7.1",
  "pip-audit==2.10.1",
  "playwright==1.65.2",
  "pytest>=8,<10",
  "pytest-playwright==0.10.0",
  "pyyaml==6.0.3",
  "ruff==0.17.5",
]
# Builds the blog (pelicanconf.py, theme/, content/blog); the output ships.
site = [
  "markdown==3.11.3",
  "pelican==4.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# e2e tests need a browser, so a plain pytest run (make check) skips them;
# make e2e selects them with -m e2e.
addopts = "-m 'not e2e'"
markers = ["e2e: Chromium tests against the built site (make e2e)"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
