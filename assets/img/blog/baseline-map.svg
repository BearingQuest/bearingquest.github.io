<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" role="img" aria-labelledby="t d">
<title id="t">What engineering baseline 2.0 covers</title>
<desc id="d">Engineering baseline 2.0 has 73 controls. 59 apply to each repository: Local quality gates 8 (caught before code leaves the Mac); CI and supply chain 18 (checked before reaching main); AI agent rules 9 (what the agent can do without me); GitHub settings 9 (enforced by the platform, not habit); Records 8 (the next session can see why); UI, AWS and template 7 (only where they apply). 14 sit above the repositories: Organization 7 (one security setup for every repo); Dusten's Mac 4 (root-owned agent settings, sandbox); Accounts and AWS 3 (spending caps, credential inventory).</desc>
<rect x="0.5" y="0.5" width="859" height="559" rx="12" fill="#FFFFFF" stroke="#D5DBE2"/>
<text x="32" y="48" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1B365D">Engineering baseline 2.0: 73 controls</text>
<text x="32" y="76" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" fill="#5B6B7F">Each has an ID, a scope and a named check, so an audit is a checklist, not a judgement call.</text>
<rect x="32" y="100" width="796" height="262" rx="10" fill="#F4F6F8" stroke="#D5DBE2"/>
<text x="48" y="128" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1B365D">Each repository: 59</text>
