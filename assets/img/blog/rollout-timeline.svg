<text x="171" y="224" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#3A3D40" text-anchor="middle">and fixed</text>
<circle cx="283" cy="150" r="8" fill="#C85A27" stroke="#FFFFFF" stroke-width="2"/>
<text x="283" y="92" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1B365D" text-anchor="middle">11</text>
