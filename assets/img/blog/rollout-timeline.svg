<text x="394" y="224" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#3A3D40" text-anchor="middle">managed settings</text>
<circle cx="506" cy="150" r="8" fill="#C85A27" stroke="#FFFFFF" stroke-width="2"/>
