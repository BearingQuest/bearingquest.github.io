<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">Baseline 2.0 rollout timeline, 9 to 18 November 2026</title>
<desc id="d">9 Nov: Baseline 2.0 adopted; 10–11: Site audited and fixed; 11: Template created, sandbox pilot; 14: Template audit; managed settings; 14–15: risk-register; 15: questvector, questcast; 17: risk-trainer; the site's last rows; 17–18: Sandbox on Mac-wide</desc>
<rect x="0.5" y="0.5" width="899" height="299" rx="12" fill="#FFFFFF" stroke="#D5DBE2"/>
<text x="32" y="48" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1B365D">Ten days, six repositories</text>
<line x1="60" y1="150" x2="840" y2="150" stroke="#1B365D" stroke-width="3"/>
<circle cx="60" cy="150" r="8" fill="#C85A27" stroke="#FFFFFF" stroke-width="2"/>
<text x="60" y="92" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1B365D" text-anchor="middle">9 Nov</text>
<text x="60" y="111" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#3A3D40" text-anchor="middle">Baseline 2.0</text>
<text x="60" y="128" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" fill="#3A3D40" text-anchor="middle">adopted</text>
