name: Scorecard

# OpenSSF Scorecard analysis of this repository, published to scorecard.dev
# (badge in README.md) and uploaded to code scanning as SARIF. Not a required
# check. Publishing results restricts this workflow (ossf/scorecard-action
# README, "Workflow Restrictions"): no top-level env or defaults, no workflow
# level write permissions, no job-level env or defaults, and only approved
# actions and no `run` steps in the Scorecard job. Supported triggers are
# push and schedule (default branch only).

on:
  schedule:
    - cron: "23 4 * * 3"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write # upload the SARIF report to code scanning
      id-token: write # publish_results: OIDC token for the Scorecard API
      contents: read # check out the repository
      actions: read # Scorecard reads workflow runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
