name: Pages

# Publishes the site to GitHub Pages. Only the paths listed in site-files.txt
# are copied into the artifact, so repo files such as AGENTS.md, tests/ and
# .github/ never reach bearingquest.com. The blog is the one generated part:
# Pelican builds content/blog into /blog/ from the locked "site" dependency
# group (the dev group is left out). The build job also runs on pull
# requests to prove the copy step; only a push to main or a manual run on
# main deploys. The custom domain comes from the repository's Pages settings, not
# from the CNAME file, which stays in the repo (unpublished) as the
# branch-publishing fallback.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Per ref, so pull request builds never queue behind or replace a deploy.
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caching is off: this job's output is published, so it must not restore
      # a cache a pull request could have written.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: false
      # uv installs the Python named in .python-version, then Pelican from uv.lock.
      - name: Copy the paths in site-files.txt into _site and build the blog with Pelican
        env:
          BLOG_NO_DEV: "1"
        run: bash scripts/build-site.sh _site
      # R22: CycloneDX SBOM of the locked site group (the same command as make sbom);
      # the dev group is left out.
      - name: Write the SBOM of the site dependency group
        run: |
          mkdir -p _build
          uv export --locked --format cyclonedx1.5 --only-group site --no-emit-project --output-file _build/sbom-site.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-site
          path: _build/sbom-site.cdx.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One deploy at a time; a running deploy is never cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # deploy the artifact to GitHub Pages
      id-token: write # deploy-pages proves the run's origin to Pages with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # R23: read-only check of the live site after a deploy. A failure here does not roll
  # the deploy back; it alerts by failing the run. Pages caches for up to about 10
  # minutes, so the check retries for up to 3 minutes before it gives up.
  smoke:
    name: smoke
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only the newest deploy's check matters, so a newer run cancels an older one.
    concurrency:
      group: pages-smoke
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"
          enable-cache: false
      - name: Check the live site, retrying for up to 3 minutes
        run: |
          for attempt in 1 2 3 4; do
            uv run --no-project python3 scripts/smoke.py && exit 0
            [ "$attempt" -lt 4 ] && sleep 45
          done
          exit 1
