# Weekly version updates for Python dependencies (uv.lock) and GitHub Actions.
# Minor and patch bumps are grouped into one pull request per ecosystem;
# major bumps open their own pull request so each can be reviewed alone.
# A 7-day cooldown waits a week after a release before proposing it, so a
# compromised release has time to be caught and pulled first.
# Not covered: the gitleaks version and checksum, and the zizmor and semgrep
# versions, in ci.yml are bumped by hand. So is the Playwright container tag
# and digest in the e2e job: Dependabot bumps playwright in uv.lock only, so
# its Playwright pull request fails the tie test in tests/test_workflows.py by
# design. Bump the lock, the tag and the digest together in one pull request
# (steps are in docs/decisions.md).
version: 2
updates:
  # The uv ecosystem updates pyproject.toml and uv.lock together.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
