{% extends "base.html" %}
{% block title %}{{ article.title }}{% endblock %}
{% block description %}{{ article.summary | striptags }}{% endblock %}
{% block content %}
      <article class="post">
        <h1 id="page-title">{{ article.title }}</h1>
        <p class="post-date"><time datetime="{{ article.date.strftime('%Y-%m-%d') }}">{{ article.date.strftime('%-d %B %Y') }}</time></p>
{{ article.content | safe }}
      </article>
{% endblock %}
